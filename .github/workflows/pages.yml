name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-pages.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false        # site/ is plain git; never pull the PDF LFS objects
          fetch-depth: 0    # for sitemap lastmod from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Re-host committed site/ for Pages
        env:
          # configure-pages reports https://eminogrande.github.io + /proud-de today,
          # and https://proud.de + "" once the custom domain is set in repo settings.
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          export PAGES_LASTMOD=$(git log -1 --format=%cs -- site)
          node scripts/build-pages.mjs site _pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
